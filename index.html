<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="/favicon.png" />
  <meta property="og:title" content="Innovation-Plastic Cans Ltd." />
  <meta property="og:type" content="Plastic Packaging Factory" />
  <meta property="og:url" content="https://www.innovation-plastic.com/" />
  <meta property="og:image" content="/logo/IPCL_logo.png" />
  <meta property="og:description"
    content="Plastic packaging factory specializing in custom bottles, containers, and industrial packaging with advanced machinery and reliable bulk production." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="google-site-verification" content="4oAWVzzdTy64ZtVvrJ3VTDw27VgCurTZiO37stLCEJU" />
  <link rel="canonical" href="https://www.innovation-plastic.com/" />
  <link rel="preload" as="image" href="/img/Slider_4.jpg" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Innovation-Plastic Cans Ltd.</title>
  <script>
    window.__IPCL_BOOT_STARTED__ = Date.now();
    window.addEventListener("error", function (event) {
      var target = event.target;
      if (!target || target.tagName !== "LINK" || target.rel !== "stylesheet") return;

      var reloadKey = "ipcl-recovered-assets";
      try {
        if (!sessionStorage.getItem(reloadKey)) {
          sessionStorage.setItem(reloadKey, "1");
          window.location.reload();
        }
      } catch (_) {
        window.location.reload();
      }
    }, true);
  </script>
  <style>
    html, body { margin: 0; background: #050b12; }
    .site-boot-loader { position: fixed; inset: 0; z-index: 999999; display: grid; place-items: center; min-height: 100vh; background: radial-gradient(circle at center, #123149 0%, #091822 48%, #050b12 100%); transition: opacity .25s ease, visibility .25s ease; }
    .site-boot-loader.is-hidden { visibility: hidden; opacity: 0; }
    .ipcl-loader-orbit { position: relative; width: 84px; height: 84px; border-radius: 50%; animation: ipcl-spin 1.15s linear infinite; }
    .ipcl-loader-dot { position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; border-radius: 50%; transform-origin: 0 0; background: #00aeef; box-shadow: 0 0 8px rgba(0,174,239,.95), 0 0 18px rgba(0,174,239,.65); }
    .ipcl-loader-dot:nth-child(1) { transform: rotate(0deg) translateY(-35px); }
    .ipcl-loader-dot:nth-child(2) { transform: rotate(45deg) translateY(-35px) scale(.72); opacity: .45; }
    .ipcl-loader-dot:nth-child(3) { transform: rotate(90deg) translateY(-35px); background: #00a651; box-shadow: 0 0 8px rgba(0,166,81,.95), 0 0 18px rgba(0,166,81,.65); }
    .ipcl-loader-dot:nth-child(4) { transform: rotate(135deg) translateY(-35px) scale(.72); opacity: .45; }
    .ipcl-loader-dot:nth-child(5) { transform: rotate(180deg) translateY(-35px); }
    .ipcl-loader-dot:nth-child(6) { transform: rotate(225deg) translateY(-35px) scale(.72); opacity: .45; }
    .ipcl-loader-dot:nth-child(7) { transform: rotate(270deg) translateY(-35px); background: #00a651; box-shadow: 0 0 8px rgba(0,166,81,.95), 0 0 18px rgba(0,166,81,.65); }
    .ipcl-loader-dot:nth-child(8) { transform: rotate(315deg) translateY(-35px) scale(.72); opacity: .45; }
    .ipcl-loader-glow { position: absolute; inset: 17px; border-radius: 50%; background: rgba(0,174,239,.2); box-shadow: 0 0 22px rgba(0,174,239,.55); animation: ipcl-pulse 1s ease-in-out infinite; }
    @keyframes ipcl-spin { to { transform: rotate(360deg); } }
    @keyframes ipcl-pulse { 50% { opacity: .4; transform: scale(.72); } }
    @media (max-width: 640px) { .ipcl-loader-orbit { width: 72px; height: 72px; } }
    @media (prefers-reduced-motion: reduce) { .ipcl-loader-orbit { animation-duration: 2.4s; } }
  </style>
</head>

<body>
  <div id="site-boot-loader" class="site-boot-loader" role="status" aria-live="polite" aria-label="Loading"><div class="ipcl-loader-orbit" aria-hidden="true"><span class="ipcl-loader-dot"></span><span class="ipcl-loader-dot"></span><span class="ipcl-loader-dot"></span><span class="ipcl-loader-dot"></span><span class="ipcl-loader-dot"></span><span class="ipcl-loader-dot"></span><span class="ipcl-loader-dot"></span><span class="ipcl-loader-dot"></span><span class="ipcl-loader-glow"></span></div></div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
