<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="/favicon.png" />
  <meta property="og:title" content="Innovation-Plastic Cans Ltd." />
  <meta property="og:type" content="Plastic Packaging Factory" />
  <meta property="og:url" content="https://www.innovation-plastic.com/" />
  <meta property="og:image" content="/logo/IPCL_logo.png" />
  <meta property="og:description"
    content="Plastic packaging factory specializing in custom bottles, containers, and industrial packaging with advanced machinery and reliable bulk production." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="google-site-verification" content="4oAWVzzdTy64ZtVvrJ3VTDw27VgCurTZiO37stLCEJU" />
  <link rel="canonical" href="https://www.innovation-plastic.com/" />
  <link rel="preload" as="image" href="/img/Slider_4.jpg" fetchpriority="high" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Innovation-Plastic Cans Ltd.</title>
  <script>
    window.addEventListener("error", function (event) {
      var target = event.target;
      if (!target || target.tagName !== "LINK" || target.rel !== "stylesheet") return;

      var reloadKey = "ipcl-recovered-assets";
      try {
        if (!sessionStorage.getItem(reloadKey)) {
          sessionStorage.setItem(reloadKey, "1");
          window.location.reload();
        }
      } catch (_) {
        window.location.reload();
      }
    }, true);
  </script>
  <style>
    .site-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: grid;
      place-items: center;
      color: #f8fafc;
      background: radial-gradient(circle at 50% 42%, #123149 0, #081522 48%, #050b12 100%);
      opacity: 1;
      transition: opacity 260ms ease, visibility 260ms ease;
    }
    .site-boot-loader.is-hidden {
      visibility: hidden;
      opacity: 0;
    }
    .ipcl-loader-content { display: grid; justify-items: center; gap: 18px; }
    .ipcl-loader-mark { position: relative; display: grid; width: 76px; height: 76px; place-items: center; }
    .ipcl-loader-ring, .ipcl-loader-orbit {
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }
    .ipcl-loader-ring {
      border: 2px solid rgba(148, 163, 184, .24);
      border-top-color: #00aeef;
      border-right-color: rgba(0, 174, 239, .5);
      box-shadow: 0 0 20px rgba(0, 174, 239, .18);
      animation: ipcl-spin 1.3s linear infinite;
    }
    .ipcl-loader-orbit { animation: ipcl-spin 2.4s linear infinite reverse; }
    .ipcl-loader-dot {
      position: absolute;
      top: -3px;
      left: calc(50% - 3px);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00aeef;
      box-shadow: 0 0 12px 3px rgba(0, 174, 239, .75);
    }
    .ipcl-loader-logo { width: 42px; height: 42px; object-fit: contain; }
    .ipcl-loader-dots { display: flex; gap: 7px; }
    .ipcl-loader-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00aeef;
      box-shadow: 0 0 10px rgba(0, 174, 239, .7);
      animation: ipcl-pulse 1.1s ease-in-out infinite;
    }
    .ipcl-loader-dots span:nth-child(2) { animation-delay: 150ms; }
    .ipcl-loader-dots span:nth-child(3) { animation-delay: 300ms; }
    .ipcl-loader-label { margin: 0; color: #dbe7ee; font: 600 13px/1.4 system-ui, sans-serif; }
    @keyframes ipcl-spin { to { transform: rotate(360deg); } }
    @keyframes ipcl-pulse { 0%, 80%, 100% { opacity: .35; transform: scale(.75); } 40% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) {
      .ipcl-loader-ring, .ipcl-loader-orbit, .ipcl-loader-dots span { animation-duration: 3s; }
    }
  </style>
</head>

<body>
  <div id="site-boot-loader" class="site-boot-loader" role="status" aria-live="polite" aria-label="Loading Innovation Plastic Cans">
    <div class="ipcl-loader-content">
      <div class="ipcl-loader-mark" aria-hidden="true">
        <span class="ipcl-loader-ring"></span>
        <span class="ipcl-loader-orbit"><span class="ipcl-loader-dot"></span></span>
        <img class="ipcl-loader-logo" src="/logo/IPCL_logo.png" alt="" width="42" height="42" fetchpriority="high" />
      </div>
      <p class="ipcl-loader-label">Loading Innovation Plastic Cans</p>
      <div class="ipcl-loader-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
